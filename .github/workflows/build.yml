name: Auto Build Plugin Zip

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Zip Files
        run: |
          mkdir -p CineFreak
          cp -f *.js manifest.json CineFreak/ 2>/dev/null || true
          
          # Creates cinefreak.zip with the folder structure
          zip -r cinefreak.zip CineFreak/
          
          # Creates plugins.zip containing the folder structure
          zip -r plugins.zip CineFreak/

      - name: Commit and Push Zip Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add cinefreak.zip plugins.zip
          git commit -m "Auto-build zip archives [skip ci]" || echo "No changes to commit"
          git push origin HEAD:${{ github.ref_name }}
