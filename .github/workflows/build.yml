mkdir -p .github/workflows
cat << 'EOF' > .github/workflows/build.yml
name: Auto Build Plugin Archives

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Zip Plugin Files
        run: |
          mkdir -p CineFreak
          # Copy all plugin JS and manifest files into the CineFreak build directory
          cp -f *.js manifest.json CineFreak/ 2>/dev/null || true
          
          # Create both .zim and .zip packages
          zip -r cinefreak.zim CineFreak/
          zip -r plugins.zip CineFreak/

      - name: Commit and Push Archives
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add cinefreak.zim plugins.zip
          git commit -m "Auto-build plugin archives [skip ci]" || echo "No changes to commit"
          git push origin HEAD:${{ github.ref_name }}
EOF
